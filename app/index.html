<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruutuaikataulu</title>
<meta name="description" content="Omat urheilulajit, tv- ja suoratoistolähetykset Suomessa">
<meta name="theme-color" content="#0F1B26" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F7FA" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ruutuaikataulu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/archivo.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="app.css?v=26">
</head>
<body>
<header class="top">
  <h1>Ruutuaikataulu</h1>
  <p class="updated" id="updated">Ladataan…</p>
  <button type="button" class="gear" id="openSettings" aria-label="Asetukset" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<nav class="filters" aria-label="Lajit">
  <div class="chips" id="chips" role="group" aria-label="Näytettävät lajit"></div>
  <div class="toggles">
    <div class="trow">
      <button type="button" class="collapse-all" id="collapseAll" aria-label="Pienennä kaikki päivät">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11l5-5 5 5M7 18l5-5 5 5"/></svg>
        Pienennä päivät
      </button>
    </div>
  </div>
</nav>

<section class="live" id="live" aria-label="Livenä nyt" hidden></section>

<main id="list" aria-live="polite"></main>

<footer class="foot" id="foot"></footer>

<dialog class="teams" id="settingsDialog" aria-labelledby="settingsTitle">
  <form method="dialog">
    <header class="teams-head">
      <h2 id="settingsTitle">Asetukset</h2>
      <button class="done" value="done">Valmis</button>
    </header>
    <div class="settings-body">
      <label class="toggle"><input type="checkbox" id="primeOnly" checked> Vain primetime (15–23)</label>
      <label class="toggle"><input type="checkbox" id="freeOnly"> Vain ilmaiset lähetykset</label>
      <div class="trow">
        <label class="toggle"><input type="checkbox" id="followOnly"> Vain seuratut joukkueet</label>
        <button type="button" class="pick-teams" id="pickTeams">Valitse joukkueet</button>
      </div>
    </div>
  </form>
</dialog>

<dialog class="teams" id="teamsDialog" aria-labelledby="teamsTitle">
  <form method="dialog">
    <header class="teams-head">
      <h2 id="teamsTitle">Seurattavat joukkueet</h2>
      <button class="done" value="done">Valmis</button>
    </header>
    <p class="teams-hint">Valitse Liigasta ja NHL:stä joukkueet, joiden ottelut haluat nähdä, kun "Näytä vain seurattavat joukkueet" on päällä. Valinnat tallentuvat tähän puhelimeen.</p>
    <div id="teamsBody"></div>
  </form>
</dialog>

<template id="row">
  <div class="ev">
    <time class="t"></time>
    <span class="bar" aria-hidden="true"></span>
    <span class="what">
      <span class="series"></span>
      <a class="title go" target="_blank" rel="noopener"></a>
      <span class="session"></span>
    </span>
    <span class="where"></span>
    <a class="remind" target="_blank" rel="noopener" title="Muistuta">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
    </a>
  </div>
</template>

<script src="app.js?v=26" defer></script>
</body>
</html>
