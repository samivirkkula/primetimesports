<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruutuaikataulu</title>
<meta name="description" content="Omat urheilulajit, tv- ja suoratoistolähetykset Suomessa">
<meta name="theme-color" content="#0F1B26" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F7FA" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ruutuaikataulu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/archivo.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="app.css?v=10">
</head>
<body>
<header class="top">
  <h1>Ruutuaikataulu</h1>
  <p class="updated" id="updated">Ladataan…</p>
</header>

<nav class="filters" aria-label="Lajit">
  <div class="chips" id="chips" role="group" aria-label="Näytettävät lajit"></div>
  <div class="toggles">
    <label class="toggle"><input type="checkbox" id="primeOnly" checked> Näytä vain primetime (klo 15–23 alkavat)</label>
    <button type="button" class="collapse-all" id="collapseAll">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11l5-5 5 5M7 18l5-5 5 5"/></svg>
      Pienennä kaikki päivät
    </button>
  </div>
</nav>

<main id="list" aria-live="polite"></main>

<footer class="foot" id="foot"></footer>

<template id="row">
  <div class="ev">
    <time class="t"></time>
    <span class="bar" aria-hidden="true"></span>
    <span class="what">
      <span class="series"></span>
      <a class="title go" target="_blank" rel="noopener"></a>
      <span class="session"></span>
    </span>
    <span class="where"></span>
    <a class="remind" target="_blank" rel="noopener" title="Muistuta">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
    </a>
  </div>
</template>

<script src="app.js?v=10" defer></script>
</body>
</html>
