name: Päivitä aikataulu ja julkaise

on:
  schedule:
    # Kerran päivässä klo 16.00 Suomen aikaa. Cron on UTC-aikaa:
    # 14.00 UTC = 16.00 talviaikaa, 13.00 UTC = 16.00 kesäaikaa.
    # "gate"-vaihe päästää läpi vain ajon, joka osuu Suomessa klo 16:een.
    - cron: "0 13,14 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          hour=$(TZ=Europe/Helsinki date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "16" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ohitetaan: Suomessa klo $hour, ajo tehdään klo 16."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Viimeisin onnistunut haku per lähde: jos lähde on hetkellisesti rikki,
      # käytetään enintään 72 h vanhaa tietoa.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Testit
        run: python -m unittest discover -s tests -t .

      - name: Hae lähetystiedot
        run: python -m scraper.build

      - name: Kokoa sivusto
        run: cp -r app/. site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
